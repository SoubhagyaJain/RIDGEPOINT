[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ridgepoint"
version = "0.1.0"
description = "A measured single-GPU LLM inference engine lab"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.8.0",
  "pyyaml>=6.0.2,<7",
  "numpy>=2.1,<3",
  "transformers>=4.57,<5",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "huggingface-hub>=0.30,<1",
  "safetensors>=0.4,<1",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<0.13"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/ridgepoint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
